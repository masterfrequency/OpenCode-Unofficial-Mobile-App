plugins { id 'com.android.application' }

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'dev.phonkalphabet.opencode.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.phonkalphabet.opencode.mobile'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release') &&
            (task.name.toLowerCase().contains('assemble') || task.name.toLowerCase().contains('bundle'))
    }
    if (releaseRequested && !keystorePropertiesFile.exists()) {
        throw new GradleException('A signed release requires keystore.properties. Copy keystore.properties.example and provide your private signing configuration.')
    }
    if (releaseRequested) {
        ['opencode-unofficial-setup.exe', 'opencode-unofficial-gateway.deb'].each { filename ->
            if (!file("src/main/assets/${filename}").exists()) {
                throw new GradleException("Production release is missing bundled installer: ${filename}. Use the release workflow or build the installer before compiling the APK.")
            }
        }
    }
}
