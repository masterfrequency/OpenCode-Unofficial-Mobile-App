name: Production release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build gateway installers for embedding
        run: |
          mkdir -p packaging/windows-installer/payload/gateway
          cp -R gateway/. packaging/windows-installer/payload/gateway/
          (cd packaging/windows-installer && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../../app/src/main/assets/opencode-unofficial-setup-unsigned.exe .)
          chmod +x packaging/debian/build-deb.sh packaging/debian/opencode-unofficial-setup
          packaging/debian/build-deb.sh
      - name: Sign Windows installer
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$WINDOWS_CERTIFICATE_BASE64" && test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          sudo apt-get update && sudo apt-get install -y osslsigncode
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > windows-signing.pfx
          osslsigncode sign -pkcs12 windows-signing.pfx -pass "$WINDOWS_CERTIFICATE_PASSWORD" -n 'OpenCode Unofficial Gateway Setup' -h sha256 -ts http://timestamp.digicert.com -in app/src/main/assets/opencode-unofficial-setup-unsigned.exe -out app/src/main/assets/opencode-unofficial-setup.exe
          rm windows-signing.pfx app/src/main/assets/opencode-unofficial-setup-unsigned.exe
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          {
            echo 'storeFile=release-key.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build release APK and Play bundle
        run: gradle clean lintRelease assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Create release checksums
        run: |
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/src/main/assets/opencode-unofficial-setup.exe \
            app/src/main/assets/opencode-unofficial-gateway.deb \
            > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Unofficial-1.0.0-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/src/main/assets/opencode-unofficial-setup.exe
            app/src/main/assets/opencode-unofficial-gateway.deb
            SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/src/main/assets/opencode-unofficial-setup.exe \
            app/src/main/assets/opencode-unofficial-gateway.deb \
            SHA256SUMS.txt \
            --generate-notes \
            --title "OpenCode Unofficial $GITHUB_REF_NAME"
